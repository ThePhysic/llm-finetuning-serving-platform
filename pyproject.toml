[build-system]
requires = ["hatchling>=1.26,<2"]
build-backend = "hatchling.build"

[project]
name = "llm-finetuning-serving-platform"
version = "0.1.0"
description = "Reproducible LoRA adaptation, evaluation, versioned inference and GPU benchmarking"
requires-python = ">=3.11,<3.14"
dependencies = [
  "fastapi>=0.115,<1", "uvicorn>=0.34,<1", "httpx>=0.28,<1",
  "pydantic>=2.10,<3", "prometheus-client>=0.21,<1", "numpy>=1.26,<3",
  "huggingface-hub>=0.28,<1", "typer>=0.15,<1",
]

[project.optional-dependencies]
train = ["torch>=2.6,<3", "transformers>=4.51,<5", "peft>=0.15,<1", "accelerate>=1.5,<2", "safetensors>=0.5,<1"]
qlora = ["bitsandbytes>=0.45,<1; platform_system == 'Linux'"]
vllm = ["vllm>=0.8,<1; platform_system == 'Linux'"]
dev = ["pytest>=8.3,<10", "pytest-asyncio>=0.25,<2", "ruff>=0.11,<1"]

[project.scripts]
llm-platform = "llm_platform.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["src/llm_platform"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
markers = ["gpu: requires actual CUDA hardware and model weights", "integration: real model or subprocess integration"]

[tool.ruff]
line-length = 110
target-version = "py311"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]
