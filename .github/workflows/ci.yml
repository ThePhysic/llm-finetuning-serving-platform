name: CPU validation
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      CUDA_VISIBLE_DEVICES: ''
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements/cpu.lock
      - run: python -m pip install --require-hashes -r requirements/cpu.lock
      - run: python -m pip install --no-deps -e .
      - run: ruff check src tests scripts
      - run: pytest -q
      - run: llm-platform data verify data/triage-v3
      - run: llm-platform doctor
      # Allow only a validated future absence of human judgments; current evidence is complete.
      - run: llm-platform audit-evidence --allow-expected-human-pending
